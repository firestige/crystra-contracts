name: Crystra contract candidate

on:
  push:
    branches:
      - release/next

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release trigger branch
        run: test "$GITHUB_REF_NAME" = "release/next"
      - name: Check out this component
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
      - name: Resolve immutable release request
        id: request
        run: |
          CANDIDATE_TAG="$(node release/cli/release.cjs request | jq -er .candidate_tag)"
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
      - name: Run acceptance
        run: |
          node release/cli/qualify.cjs --install > "$RUNNER_TEMP/contract-qualification.json"
          node --test test/tooling/release/*.test.cjs
          git diff --exit-code
      - name: Build and verify current resource assets
        run: |
          node release/cli/release.cjs build "$RUNNER_TEMP/local-release" "$GITHUB_SHA"
          node release/cli/release.cjs verify "$RUNNER_TEMP/local-release"
      - name: Resolve resumable RC state
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
        run: |
          if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" --jq .object.sha)" = "$GITHUB_SHA"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$CANDIDATE_TAG" >/dev/null 2>&1; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" --jq .object.sha)" = "$GITHUB_SHA"
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or resume RC with exact local assets
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
          RC_EXISTS: ${{ steps.candidate.outputs.exists }}
        run: |
          if test "$RC_EXISTS" != true; then
            gh release create "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA"
          fi
          mkdir "$RUNNER_TEMP/existing-assets"
          for FILE in "$RUNNER_TEMP/local-release/"*; do
            NAME="$(basename "$FILE")"
            if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$NAME"; then
              gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir "$RUNNER_TEMP/existing-assets"
              cmp "$FILE" "$RUNNER_TEMP/existing-assets/$NAME"
            else
              gh release upload "$CANDIDATE_TAG" "$FILE" --repo "$GITHUB_REPOSITORY"
            fi
          done
          mkdir "$RUNNER_TEMP/remote-release"
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/remote-release"
          node release/cli/release.cjs verify "$RUNNER_TEMP/remote-release"
          cmp "$RUNNER_TEMP/local-release/release-metadata.json" "$RUNNER_TEMP/remote-release/release-metadata.json"
      - name: Attach qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
        run: |
          export CANDIDATE_TAG
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto"),path=require("node:path"); const p=process.env.RUNNER_TEMP,m=fs.readFileSync(path.join(p,"remote-release/release-metadata.json")); fs.writeFileSync(path.join(p,"release-qualification.json"),JSON.stringify({schemaVersion:"crystra.release-qualification@1.0.0",candidateTag:process.env.CANDIDATE_TAG,commit:process.env.GITHUB_SHA,artifactMetadataSha256:"sha256:"+crypto.createHash("sha256").update(m).digest("hex"),localAcceptance:JSON.parse(fs.readFileSync(path.join(p,"contract-qualification.json"))),remoteQualification:{status:"PASS"}},null,2)+"\n")'
          if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq release-qualification.json; then
            mkdir "$RUNNER_TEMP/existing-qualification"
            gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern release-qualification.json --dir "$RUNNER_TEMP/existing-qualification"
            cmp "$RUNNER_TEMP/release-qualification.json" "$RUNNER_TEMP/existing-qualification/release-qualification.json"
          else
            gh release upload "$CANDIDATE_TAG" "$RUNNER_TEMP/release-qualification.json" --repo "$GITHUB_REPOSITORY"
          fi
