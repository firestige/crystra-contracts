name: Crystra contract qualification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this component
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Qualify every current contract locally
        run: node release/cli/qualify.cjs --install > "$RUNNER_TEMP/contract-qualification.json"
      - name: Test release tooling
        run: node --test test/tooling/release/*.test.cjs
      - name: Check source generation and current resource integrity
        run: |
          git diff --exit-code
          node release/cli/current-bundle.cjs build "$RUNNER_TEMP/current-contracts" "$GITHUB_SHA"
          node release/cli/current-bundle.cjs verify "$RUNNER_TEMP/current-contracts"
